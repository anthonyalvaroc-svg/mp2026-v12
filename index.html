<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Reportes Site MP</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0f766e" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <style>
    :root {
      --bg: #f8fafc;
      --card: #ffffff;
      --border: #e2e8f0;
      --text: #0f172a;
      --muted: #64748b;
      --accent: #0f766e;
      --accent-hover: #115e59;
      --complete: #065f46;
      --danger: #dc2626;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); padding-bottom: 40px; }
    header {
      background: var(--card);
      border-bottom: 1px solid var(--border);
      padding: 14px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 20;
    }
    header h1 { font-size: 1.05rem; font-weight: 700; letter-spacing: -0.01em; }
    .ver-badge { font-size: 0.75rem; color: var(--muted); background: #f1f5f9; padding: 3px 8px; border-radius: 6px; font-weight: 600; }
    .container { max-width: 760px; margin: 0 auto; padding: 14px; }
    .create-box {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
    }
    .create-box input {
      flex: 1;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 0.95rem;
      outline: none;
      background: #f8fafc;
    }
    .create-box input:focus { border-color: var(--accent); background: #fff; }
    .btn {
      border: 1px solid transparent;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background 0.15s;
    }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:active { background: var(--accent-hover); }
    .btn-outline { background: #fff; border-color: var(--border); color: var(--text); }
    .btn-outline:active { background: #f1f5f9; }
    .btn-danger { background: #fef2f2; border-color: #fecaca; color: var(--danger); }
    .btn-sm { padding: 7px 11px; font-size: 0.82rem; }

    /* Proyecto activo */
    .project-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px;
      margin-bottom: 14px;
    }
    .project-header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }
    .project-title-row {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .project-title { font-size: 1.1rem; font-weight: 700; }
    .pct-pill {
      font-size: 0.82rem;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 999px;
      background: #ccfbf1;
      color: var(--accent);
    }
    .pct-pill.done {
      background: var(--complete);
      color: #ffffff;
    }
    .progress-track {
      width: 100%;
      height: 8px;
      background: #e2e8f0;
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 12px;
    }
    .progress-fill {
      height: 100%;
      background: var(--accent);
      width: 0%;
      transition: width 0.25s ease, background 0.25s ease;
    }
    .progress-fill.done {
      background: var(--complete);
    }
    .project-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    /* Tabs */
    .tabs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      margin-bottom: 14px;
    }
    .tab-btn {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 6px;
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--muted);
      cursor: pointer;
      text-align: center;
      line-height: 1.25;
    }
    .tab-btn.active {
      background: var(--text);
      color: #ffffff;
      border-color: var(--text);
    }

    /* Subcarpetas */
    .sub-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 10px;
    }
    .sub-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
      margin-bottom: 4px;
    }
    .sub-title { font-size: 0.92rem; font-weight: 700; }
    .sub-status {
      font-size: 0.74rem;
      padding: 2px 8px;
      border-radius: 6px;
      white-space: nowrap;
      font-weight: 600;
    }
    .status-empty { background: #f1f5f9; color: var(--muted); }
    .status-filled { background: #ccfbf1; color: var(--accent); }
    .sub-desc { font-size: 0.78rem; color: var(--muted); margin-bottom: 10px; line-height: 1.35; }
    .sub-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

    /* Miniaturas */
    .thumb-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(76px, 1fr));
      gap: 8px;
      margin-top: 10px;
    }
    .thumb-item {
      position: relative;
      aspect-ratio: 1;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid var(--border);
      background: #f1f5f9;
      cursor: pointer;
    }
    .thumb-item img, .thumb-item video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .pdf-badge {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--danger);
      padding: 4px;
      text-align: center;
      word-break: break-word;
    }
    .del-mini {
      position: absolute;
      top: 3px;
      right: 3px;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: none;
      background: rgba(220, 38, 38, 0.9);
      color: #fff;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Lista de proyectos guardados */
    .saved-list { margin-bottom: 14px; display: flex; flex-wrap: wrap; gap: 6px; }
    .saved-chip {
      padding: 6px 10px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--card);
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .saved-chip.active { border-color: var(--accent); background: #f0fdfa; color: var(--accent); }

    /* Modal Cámara Ráfaga */
    .cam-modal {
      position: fixed;
      inset: 0;
      background: #000;
      z-index: 100;
      display: none;
      flex-direction: column;
    }
    .cam-modal.open { display: flex; }
    .cam-header {
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: #fff;
      background: rgba(0,0,0,0.6);
      position: absolute;
      top: 0; left: 0; right: 0;
      z-index: 10;
    }
    .cam-video-wrap { flex: 1; position: relative; display: flex; align-items: center; justify-content: center; overflow: hidden; }
    #camVideo { width: 100%; height: 100%; object-fit: cover; }
    .cam-footer {
      padding: 18px 24px;
      background: rgba(0,0,0,0.75);
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: absolute;
      bottom: 0; left: 0; right: 0;
      z-index: 10;
    }
    .shutter-btn {
      width: 68px;
      height: 68px;
      border-radius: 50%;
      border: 4px solid #fff;
      background: rgba(255,255,255,0.25);
      cursor: pointer;
    }
    .shutter-btn:active { background: #fff; transform: scale(0.94); }
    .cam-preview-box {
      width: 54px;
      height: 54px;
      border-radius: 8px;
      border: 2px solid #fff;
      overflow: hidden;
      position: relative;
      background: #1e293b;
      cursor: pointer;
    }
    .cam-preview-box img { width: 100%; height: 100%; object-fit: cover; }
    .cam-count-badge {
      position: absolute;
      bottom: 0; right: 0;
      background: var(--accent);
      color: #fff;
      font-size: 0.7rem;
      font-weight: 700;
      padding: 1px 5px;
    }

    /* Visor Galería */
    .viewer-modal {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.96);
      z-index: 120;
      display: none;
      flex-direction: column;
      color: #fff;
    }
    .viewer-modal.open { display: flex; }
    .viewer-top {
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255,255,255,0.12);
    }
    .viewer-body {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      padding: 16px;
      overflow: hidden;
    }
    .viewer-body img, .viewer-body video {
      max-width: 100%;
      max-height: 100%;
      border-radius: 6px;
    }
    .nav-arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(255,255,255,0.15);
      color: #fff;
      border: none;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      font-size: 1.5rem;
      cursor: pointer;
    }
    .nav-prev { left: 10px; }
    .nav-next { right: 10px; }

    /* Share bar */
    #shareReadyBar {
      display: none;
      margin-top: 10px;
      padding: 10px;
      background: #f0fdfa;
      border: 1px solid #99f6e4;
      border-radius: 8px;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
  </style>
</head>
<body>
  <header>
    <h1>Reportes Site MP</h1>
    <span class="ver-badge">v15.1 + %</span>
  </header>

  <div class="container">
    <div class="create-box">
      <input type="text" id="newProjectName" placeholder="Nombre de carpeta principal (Ej: SITE_LIMA_01)" />
      <button class="btn btn-primary" id="btnCreateProject">Crear</button>
    </div>

    <div class="saved-list" id="savedProjectsList"></div>

    <div id="activeProjectArea" style="display:none;">
      <div class="project-card">
        <div class="project-header">
          <div class="project-title-row">
            <span class="project-title" id="activeProjectTitle"></span>
            <span class="pct-pill" id="projectPctBadge">0% (0/60)</span>
          </div>
          <div class="project-actions">
            <button class="btn btn-outline btn-sm" id="btnRenameProject">Renombrar</button>
            <button class="btn btn-primary btn-sm" id="btnDownloadZip">Descargar ZIP</button>
            <button class="btn btn-outline btn-sm" id="btnPrepareShare">Compartir</button>
            <button class="btn btn-danger btn-sm" id="btnDeleteProject">Eliminar</button>
          </div>
        </div>

        <div class="progress-track">
          <div class="progress-fill" id="projectProgressBar"></div>
        </div>

        <div id="shareReadyBar">
          <span style="font-size:0.82rem; font-weight:600; color:#0f766e;" id="shareFileNameText">ZIP listo</span>
          <button class="btn btn-primary btn-sm" id="btnTriggerNativeShare">Enviar ahora</button>
        </div>
      </div>

      <div class="tabs">
        <button class="tab-btn active" data-tab="f17">1. F17-CARPETA DE FOTOS</button>
        <button class="tab-btn" data-tab="formatos">2. FORMATOS MP</button>
        <button class="tab-btn" data-tab="mp">3. MANTENIMIENTO PREVENTIVO</button>
      </div>

      <div id="subfoldersContainer"></div>
    </div>
  </div>

  <!-- Input oculto para subir archivos -->
  <input type="file" id="fileUploadInput" multiple style="display:none;" />

  <!-- Modal Cámara -->
  <div class="cam-modal" id="camModal">
    <div class="cam-header">
      <span id="camSubTitle" style="font-size:0.85rem; font-weight:600; max-width:75%; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;"></span>
      <button class="btn btn-outline btn-sm" id="btnCloseCam">Cerrar</button>
    </div>
    <div class="cam-video-wrap">
      <video id="camVideo" autoplay playsinline></video>
    </div>
    <div class="cam-footer">
      <div class="cam-preview-box" id="camLastPreview">
        <img id="camLastImg" style="display:none;" />
        <span class="cam-count-badge" id="camSessionCount">0</span>
      </div>
      <button class="shutter-btn" id="btnShutter" title="Tomar foto"></button>
      <div style="width:54px; text-align:right; color:#fff; font-size:0.72rem; opacity:0.8;">Vol +/-</div>
    </div>
  </div>

  <!-- Visor de fotos -->
  <div class="viewer-modal" id="viewerModal">
    <div class="viewer-top">
      <span id="viewerCounter" style="font-size:0.88rem; font-weight:600;">1 / 1</span>
      <div style="display:flex; gap:8px;">
        <button class="btn btn-danger btn-sm" id="btnViewerDelete">Eliminar</button>
        <button class="btn btn-outline btn-sm" id="btnCloseViewer">Cerrar</button>
      </div>
    </div>
    <div class="viewer-body" id="viewerTouchArea">
      <button class="nav-arrow nav-prev" id="btnPrevPhoto">‹</button>
      <div id="viewerContent" style="display:flex; align-items:center; justify-content:center; width:100%; height:100%;"></div>
      <button class="nav-arrow nav-next" id="btnNextPhoto">›</button>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    }
  </script>
</body>
</html>
